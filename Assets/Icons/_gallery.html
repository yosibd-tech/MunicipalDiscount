<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MunicipalDiscount — Icon Set</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 24px;
         background: #f5f7fa; color: #2A5298; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #555; margin: 0 0 20px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 16px; }
  .card { background: #fff; border: 1px solid #dfe3e8; border-radius: 8px;
          padding: 14px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .swatches { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .sw { border-radius: 6px; padding: 10px; }
  .light { background: #ffffff; border: 1px solid #eee; }
  .dark  { background: #5896A6; }   /* the app's MDI background */
  .sw img { width: 64px; height: 64px; display: block; }
  .name { margin-top: 12px; font-weight: bold; font-size: 13px; color: #2A5298;
          word-break: break-all; }
  .desc { margin-top: 2px; font-size: 12px; color: #666; }
</style>
</head>
<body>
  <h1>MunicipalDiscount — Icon Set (14)</h1>
  <p class="sub">Source SVGs from <code>Assets\Icons\</code>. Shown on white and on the app's slate background so light/white parts are visible. In the app these auto-recolor to the DevExpress Bezier skin.</p>
  <div class="grid" id="grid"></div>

  <script>
    const icons = [
      ["app.svg",              "Application / MainForm"],
      ["eligibility.svg",      "Discount eligibility check"],
      ["discount-headers.svg", "Discount file column mapping"],
      ["discount-codes.svg",   "Discount codes master"],
      ["income-criteria.svg",  "Income discount criteria"],
      ["minimum-wage.svg",     "Minimum wage"],
      ["parameters.svg",       "System parameters"],
      ["open-year.svg",        "Year-opening operations"],
      ["user-permissions.svg", "Users & permissions"],
      ["add-client.svg",       "Add new client"],
      ["category-manager.svg", "Category manager"],
      ["memo-edit.svg",        "Memo editor"],
      ["login.svg",            "Login"],
      ["user.svg",             "Logged-in user (ribbon)"],
    ];
    const grid = document.getElementById("grid");
    for (const [file, desc] of icons) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="swatches">' +
          '<div class="sw light"><img src="./' + file + '" alt="' + file + '"></div>' +
          '<div class="sw dark"><img src="./' + file + '" alt="' + file + '"></div>' +
        '</div>' +
        '<div class="name">' + file + '</div>' +
        '<div class="desc">' + desc + '</div>';
      grid.appendChild(card);
    }
  </script>
</body>
</html>
